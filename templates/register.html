<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Nookly</title>
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 60px rgba(158, 235, 221, 0.1);
            text-align: center;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e1e4e8;
            background-color: #f8fafb;
            border-radius: 16px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #9eebdd;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(158, 235, 221, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a8f0e1 0%, #8de5d2 100%);
            color: #004d40;
            font-weight: 600;
            font-size: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(141, 229, 210, 0.4);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .footer-text a {
            color: #20b2aa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #16807a;
            text-decoration: underline;
        }

        /* Умные стили для уведомлений */
        .flash {
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .flash.error {
            background-color: #ffeaea;
            color: #d93025;
            border: 1px solid #f5c2c2;
        }
        .flash.success {
            background-color: #e6f9f0;
            color: #1e8e3e;
            border: 1px solid #bce8d1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">Nookly</div>
        <p class="subtitle">Создайте аккаунт, чтобы продолжить</p>

        <!-- Логика вывода сообщений -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <input type="text" name="username" placeholder="Придумайте никнейм" required>
            <input type="password" name="password" placeholder="Придумайте пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>

        <div class="footer-text">
            Уже в Nookly? <a href="/login">Войти</a>
        </div>
    </div>

</body>
</html>
