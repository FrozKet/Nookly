{% extends "base_auth.html" %}

{% block title %}Вход - Nookly{% endblock %}
{% block subtitle %}С возвращением! Рады видеть вас снова.{% endblock %}

{% block content %}
<form method="POST" action="/login">
    <input type="text" name="username" placeholder="Ваш никнейм" required>
    <input type="password" name="password" placeholder="Ваш пароль" required>
    <button type="submit">Войти</button>
</form>
{% endblock %}

{% block footer %}
    Впервые у нас? <a href="/register">Создать аккаунт</a>
{% endblock %}
